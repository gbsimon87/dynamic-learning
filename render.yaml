# Render Blueprint — two Web Services (production and dev), each serving BOTH the built React app and
# the /api routes from the same origin. Same origin is load-bearing: the session
# is an HTTP-only cookie, so a split static-site + API deployment would need CORS
# and third-party-cookie handling that this setup avoids entirely.
#
# Usage: commit this file, then Render dashboard > New > Blueprint > pick this
# repo. Current setup: docs/PROJECT_KNOWLEDGE.md §6 item 17.

# Production (learnwithbix.com). The Blueprint keeps this service in line with
# this file, so `plan` and `branch` here are what production runs: Starter so
# it never sleeps, deployed from main. Changing them here changes production.
services:
  - type: web
    name: dynamic-learning
    runtime: node
    plan: starter
    region: frankfurt
    branch: main

    # `npm ci` for a reproducible install from package-lock.json.
    # `--include=dev` is REQUIRED and must not be removed: NODE_ENV=production
    # is set below (the server needs it at runtime for secure cookies), and npm
    # omits devDependencies whenever NODE_ENV=production. Vite is a
    # devDependency, so without this the build fails with "vite: not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js

    # "/" serves the built index.html. Deliberately NOT an /api/auth route:
    # /api/auth/me answers 401 when signed out, and Render treats a non-2xx
    # health check as a failed deploy.
    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "22.23.3"

      - key: NODE_ENV
        value: production

      # Fixed public origin for password-reset links; never trust request hosts.
      - key: PUBLIC_APP_URL
        value: https://learnwithbix.com

      # Public HTML/sitemap/robots are indexable only on this production service.
      - key: SEO_INDEXABLE
        value: "true"

      # VITE_USE_API is read at BUILD time and inlined into the bundle, so it
      # must be set here (not just at runtime) for the deployed app to talk to
      # the API instead of localStorage.
      - key: VITE_USE_API
        value: "true"

      # sync: false = Render prompts for these in the dashboard and stores them
      # there. They are never committed to this repo.
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false

      # Sign-up and recovery emails (Resend). Set BOTH or neither: with
      # neither, production skips verification instead of failing.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # PORT is injected by Render; server/index.js reads process.env.PORT and
      # falls back to 3001 locally. Do not set it here.

  # Dev: deployed from the dev branch, Free (it sleeps after ~15 idle minutes).
  # Its own database (MONGODB_DB) so nothing done on dev can touch real
  # learners' progress, and its own session secret so dev sign-ins don't work on
  # production.
  - type: web
    name: dynamic-learning-dev
    runtime: node
    plan: free
    region: frankfurt
    branch: dev
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.23.3"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        sync: false
      - key: SEO_INDEXABLE
        value: "false"
      - key: VITE_USE_API
        value: "true"
      - key: MONGODB_DB
        value: dynamic_learning_dev
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
